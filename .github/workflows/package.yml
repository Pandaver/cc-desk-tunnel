# Builds the release files on GitHub's machines instead of a maintainer's own: the Windows installer, the
# macOS and Linux packages, which no maintainer has a machine for, and the server bundle. Nothing is signed with a
# certificate; the files are kept with the run for 14 days, and attached to a draft release when the release
# script asks for that. It runs when asked for, and by itself when what does the packaging changes on a dev branch.
name: package
on:
  workflow_dispatch:
    inputs:
      release:
        description: Tag of a draft release to attach the macOS and Linux packages to. Left empty, they stay with the run.
        default: ''
  push:
    branches: ['dev/**']
    paths:
      - .github/workflows/package.yml
      - scripts/package-*.mjs
      - scripts/smoke-posix-package.mjs
      - scripts/prepare-windows.ps1
permissions:
  contents: read
concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run setup:desktop
      # The bundled OpenSSH and PowerShell, fetched and checked against the hashes the script names.
      - run: npm run prepare:windows:package
      # Ends with the packaged program started offline; a package that does not start fails here.
      - run: npm run package:windows
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: artifacts/windows/*.exe
          if-no-files-found: error
          retention-days: 14
  # One package for each kind of Mac, each built and started on a machine of its own kind. The picture is of
  # the window as the system draws it there.
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, arch: arm64 }
          - { runner: macos-15-intel, arch: x64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run setup:desktop
      - run: npm run package:macos -- --${{ matrix.arch }}
        env:
          SMOKE_SCREENSHOT: artifacts/macos/window-${{ matrix.arch }}.png
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            artifacts/macos/*.dmg
            artifacts/macos/*.zip
          if-no-files-found: error
          retention-days: 14
      # By itself, so that it can be looked at without fetching the package.
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-window
          path: artifacts/macos/*.png
          if-no-files-found: warn
          retention-days: 14
  # The .deb, built and then installed the way a user installs it, and started from where it was installed:
  # that is where its sandbox and what it depends on are in place. A virtual screen stands in for a desktop.
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb imagemagick
      - run: npm ci
      - run: npm run setup:desktop
      - run: npm run package:linux
      - run: sudo apt-get install -y ./artifacts/linux/*.deb
      - run: xvfb-run -a -s "-screen 0 1280x900x24" node scripts/smoke-posix-package.mjs "/opt/CC Desk Tunnel/cc-desk-tunnel"
        env:
          SMOKE_SCREENSHOT: artifacts/linux/window-x64.png
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: artifacts/linux/*.deb
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64-window
          path: artifacts/linux/*.png
          if-no-files-found: warn
          retention-days: 14
  server:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/package-server.mjs "$RUNNER_TEMP/cc-desk-tunnel-server.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: server
          path: ${{ runner.temp }}/cc-desk-tunnel-server.tar.gz
          if-no-files-found: error
          retention-days: 14
  # For the release script: the packages of macOS and Linux go from here to the draft release it made,
  # without passing through the maintainer's computer. The only job that may write to the repository.
  attach:
    if: inputs.release != ''
    needs: [macos, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '{macos-arm64,macos-x64,linux-x64}'
          merge-multiple: true
          path: packages
      - run: gh release upload "$TAG" packages/*.dmg packages/*.deb --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release }}
